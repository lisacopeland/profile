<div class="min-h-screen flex flex-col bg-slate-950 text-slate-100">
  <header class="w-full bg-slate-900 text-slate-100 border-b border-slate-800">
    <nav class="mx-auto px-4 lg:px-8 py-4
             grid items-center gap-4
             [grid-template-columns:1fr_auto_1fr]">
      <div class="flex items-center">
        <a routerLink="/" aria-label="Home" class="inline-flex items-center justify-center p-1 rounded-full
           hover:bg-slate-800/60 focus:outline-none focus:ring-2 focus:ring-slate-500/50">
          <img src="assets/me.jpg" srcset="assets/me@2x.jpg 2x" alt="Lisa Copeland" width="36" height="36" class="h-9 w-9 rounded-full object-cover ring-1 ring-slate-700 transition
             group-hover:ring-slate-500" loading="eager" decoding="async" fetchpriority="high" />
        </a>
      </div>

      <ul class="flex items-center justify-center gap-8 text-sm font-medium">
        <li><a routerLink="/" class="hover:underline">Home</a></li>
        <li><a routerLink="/projects" class="hover:underline">Projects</a></li>
        <li><a routerLink="/about" class="hover:underline">About</a></li>
        <li><a routerLink="/contact" class="hover:underline">Contact</a></li>
      </ul>

      <div class="flex items-center justify-end gap-2">

        <a href="https://github.com/lisacopeland" aria-label="GitHub"
          class="group p-2 rounded-lg hover:bg-slate-800/60 focus:outline-none focus:ring-2 focus:ring-slate-500/50"
          target="_blank" rel="noopener noreferrer">
          <svg class="size-5 fill-slate-300 transition-colors group-hover:fill-white" viewBox="0 0 24 24"
            aria-hidden="true">
            <path
              d="M12 .5a12 12 0 0 0-3.79 23.4c.6.11.82-.26.82-.58v-2.23c-3.34.73-4.04-1.61-4.04-1.61a3.18 3.18 0 0 0-1.34-1.76c-1.09-.75.08-.73.08-.73a2.52 2.52 0 0 1 1.84 1.24 2.56 2.56 0 0 0 3.5 1 2.55 2.55 0 0 1 .76-1.6c-2.66-.3-5.46-1.33-5.46-5.93A4.64 4.64 0 0 1 5.3 6.7a4.32 4.32 0 0 1 .12-3.18s1-.33 3.3 1.23a11.4 11.4 0 0 1 6 0c2.3-1.56 3.3-1.23 3.3-1.23.22.7.23 1.45.06 2.16a4.63 4.63 0 0 1 1.24 3.21c0 4.61-2.8 5.62-5.47 5.92a2.86 2.86 0 0 1 .82 2.22v3.29c0 .32.21.7.83.58A12 12 0 0 0 12 .5Z" />
          </svg>
          <span class="sr-only">GitHub</span>
        </a>

        <!-- LinkedIn -->
        <a href="https://www.linkedin.com/in/lisacope" aria-label="LinkedIn"
          class="group p-2 rounded-lg hover:bg-slate-800/60 focus:outline-none focus:ring-2 focus:ring-slate-500/50"
          target="_blank" rel="noopener noreferrer">
          <svg class="size-5 fill-slate-300 transition-colors group-hover:fill-white" viewBox="0 0 24 24"
            aria-hidden="true">
            <path
              d="M4.98 3.5A2.5 2.5 0 1 1 5 8.5a2.5 2.5 0 0 1-.02-5ZM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-.95 1.83-1.95 3.77-1.95 4.03 0 4.78 2.65 4.78 6.1V21h-4v-5.3c0-1.26-.02-2.88-1.76-2.88-1.76 0-2.03 1.37-2.03 2.78V21H9z" />
          </svg>
          <span class="sr-only">LinkedIn</span>
        </a>


      </div>
    </nav>
  </header>

  <main class="grow">
    <div class="mx-auto max-w-7xl px-4 py-8">
      <router-outlet />
    </div>
  </main>

  <footer class="mt-8 border-t border-slate-800">
    <div class="mx-auto px-4 py-6 text-sm text-slate-400">
      © {{ year }} Lisa Copeland
    </div>
  </footer>
</div>
