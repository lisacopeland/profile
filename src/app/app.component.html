<div class="min-h-screen flex flex-col">
  <header class="border-b bg-white/70 dark:bg-zinc-900/70 backdrop-blur sticky top-0 z-50">
    <div class="container flex items-center justify-between h-14">
      <a class="font-semibold">Your Name</a>
      <nav class="hidden md:flex items-center gap-6">
        <a routerLink="/" class="hover:underline" [routerLinkActiveOptions]="{ exact: true }"
          routerLinkActive="bg-blue-500 text-white font-bold">Home</a>
        <a routerLink="/projects" class="hover:underline" [routerLinkActiveOptions]="{ exact: true }"
          routerLinkActive="bg-blue-500 text-white font-bold">Projects</a>
        <a routerLink="/about" class="hover:underline" [routerLinkActiveOptions]="{ exact: true }"
          routerLinkActive="bg-blue-500 text-white font-bold">About</a>
        <a routerLink="/contact" class="hover:underline" [routerLinkActiveOptions]="{ exact: true }"
          routerLinkActive="bg-blue-500 text-white font-bold">Contact</a>
      </nav>
      <button class="btn">🌓</button>
    </div>
  </header>

  <main class="grow">
    <div class="mx-auto max-w-7xl px-4 py-8">
      <router-outlet />
    </div>
  </main>

  <footer class="mt-8 border-t">
    <div class="mx-auto max-w-7xl px-4 py-6 text-sm text-zinc-500">
      © {{ year }} Your Name
    </div>
  </footer>
</div>
