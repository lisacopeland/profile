<article class="card group">
  <img [src]="project.cover" [alt]="project.title" class="w-full aspect-video object-cover rounded-xl mb-4" />
  <h3 class="text-lg font-semibold mb-2 group-hover:underline">{{ project.title }}</h3>
  <p class="text-sm text-zinc-600 dark:text-zinc-400 mb-4">{{ project.summary }}</p>
  <div class="flex flex-wrap gap-2">
    <span *ngFor="let tag of project.tags" class="px-2 py-1 text-xs rounded-full bg-zinc-100 dark:bg-zinc-800">
      {{ tag }}
    </span>
  </div>
</article>
